name: Extract zip

on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        id: ex
        run: |
          if [ ! -f inventory-react.zip ]; then
            echo "Tidak ada inventory-react.zip, dilewati."
            echo "done=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unzip -q inventory-react.zip
          cp -a inventory-react/. .
          rm -rf inventory-react inventory-react.zip
          echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Commit hasil
        if: steps.ex.outputs.done == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract inventory-react.zip"
          git push
